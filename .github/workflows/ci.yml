name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma client is imported by the API and must exist before tsc runs.
      - name: Generate Prisma client
        run: npm run --workspace @capillaris/api prisma:generate

      - name: Typecheck API
        run: npm run --workspace @capillaris/api typecheck

      - name: Typecheck Web
        run: npm run --workspace @capillaris/web typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run --workspace @capillaris/api prisma:generate

      - name: Build all workspaces
        run: npm run build
